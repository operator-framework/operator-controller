{{- if and (include "objectController.enabled" .) .Values.options.objectController.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: object-controller-controller-manager
  namespace: {{ .Values.namespaces.olmv1.name }}
  labels:
    app.kubernetes.io/name: object-controller
    {{- include "olmv1.labels" . | nindent 4 }}
  annotations:
    {{- include "olmv1.annotations" . | nindent 4 }}
spec:
  {{- if .Values.options.objectController.podDisruptionBudget.minAvailable }}
  minAvailable: {{ .Values.options.objectController.podDisruptionBudget.minAvailable }}
  {{- end }}
  {{- if .Values.options.objectController.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.options.objectController.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      control-plane: object-controller-controller-manager
{{- end }}
