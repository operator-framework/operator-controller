{{- if include "objectController.enabled" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    {{- include "olmv1.annotations" $ | nindent 4 }}
  labels:
    app.kubernetes.io/name: object-controller
    {{- include "olmv1.labels" $ | nindent 4 }}
  name: object-controller-cluster-admin-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: object-controller-controller-manager
    namespace: {{ $.Values.namespaces.olmv1.name }}
{{- end }}
