                        alphanumeric character, and contain only letters, digits, or hyphens.
                      maxLength: 63
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: kind must start with a letter and contain only letters,
                          digits, or hyphens, ending with an alphanumeric character
                        rule: self.matches('^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$')
                    name:
                      description: |-
                        name is the required metadata.name of the stored object. It must be
                        1 to 253 characters, cannot be "." or "..", and cannot contain "/" or "%".
                        Resource-specific naming constraints are checked when the object is applied.
                      maxLength: 253
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: name must not be '.', '..', or contain '/' or '%'
                        rule: self != "." && self != ".." && !self.contains("/") &&
