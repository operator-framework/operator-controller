                              - message: label is required when type is Label, and
                                  forbidden otherwise
                                rule: 'self.type == ''Label'' ?has(self.label) : !has(self.label)'
                          required:
                          - assertions
                          - selector
                          type: object
                        maxItems: 20
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: atomic
                    required:
