    name: v1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterObjectDeployment manages mutable desired content through immutable
          ClusterObjectSet revisions. It is an experimental, cluster-scoped API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired deployment template.
            properties:
              revisionHistoryLimit:
                default: 5
                description: |-
                  revisionHistoryLimit is the maximum number of archived (superseded)
                  ClusterObjectSet revisions to retain, so that rollout history can be
                  inspected and earlier revisions rolled back to. Active revisions are never
                  removed and do not count against this limit. When the number of archived
                  revisions exceeds this value, the oldest archived revisions are deleted
                  until the limit is met.

                  A value of 0 retains no archived revisions. The minimum is 0, the maximum
                  is 50, and the default is 5.
                format: int32
                maximum: 50
                minimum: 0
                type: integer
              template:
                description: |-
                  template is the desired content of newly created ClusterObjectSets.
                  Changes to template create a new revision; existing revisions remain immutable.
                properties:
                  metadata:
                    description: |-
                      metadata contains labels and annotations propagated to each ClusterObjectSet
                      created from this template, except the reserved
                      olm.operatorframework.io/template-hash label, whose value is always set by the
                      controller. Changes to metadata change template identity and therefore create
                      a new revision.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          annotations is a set of key/value pairs propagated to each revision's
                          metadata. The controller validates them against the Kubernetes annotation
                          rules (key format and total size) before creating a revision; invalid
                          annotations are reported on the deployment's Progressing condition.
                        maxProperties: 32
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: labels is a set of key/value pairs propagated
                          to each revision's metadata.
                        maxProperties: 32
                        type: object
                    type: object
                  spec:
                    description: |-
                      spec contains the desired revision content. Group, revision, lifecycle state,
                      and ownership are assigned by the controller and cannot be set here.
                    properties:
                      collisionProtection:
                        description: |-
                          collisionProtection is the required default collision protection strategy for objects in the revision.
                          Objects and phases may override it.
                        enum:
                        - Prevent
                        - IfNoController
                        - None
                        type: string
                      phases:
                        description: |-
                          phases is an ordered list of 1 to 20 uniquely named phases. Each phase contains
                          at most 50 objects using the existing inline object or immutable Secret reference
                          representation. Phase, object, and probe order participate in template identity.
                        items:
                          description: |-
                            ClusterObjectSetPhase represents a group of objects that are applied together. The phase is considered
                            complete only after all objects pass their status probes.
                          properties:
                            collisionProtection:
                              description: |-
                                collisionProtection specifies the default collision protection strategy for all objects
                                in this phase. Individual objects can override this value.

                                When set, this value is used as the default for any object in this phase that does not
                                explicitly specify its own collisionProtection.

                                When omitted, we use .spec.collistionProtection as the default for any object in this phase that does not
                                explicitly specify its own collisionProtection.
                              enum:
                              - Prevent
                              - IfNoController
                              - None
                              type: string
                            name:
                              description: |-
                                name is a required identifier for this phase.

                                phase names must follow the DNS label standard as defined in [RFC 1123].
                                They must contain only lowercase alphanumeric characters or hyphens (-),
                                start and end with an alphanumeric character, and be no longer than 63 characters.

                                Common phase names include: namespaces, policies, rbac, crds, storage, deploy, publish.

                                [RFC 1123]: https://tools.ietf.org/html/rfc1123
                              maxLength: 63
                              minLength: 1
                              type: string
                              x-kubernetes-validations:
                              - message: the value must consist of only lowercase
                                  alphanumeric characters and hyphens, and must start
                                  and end with an alphanumeric character.
                                rule: '!format.dns1123Label().validate(self).hasValue()'
                            objects:
                              description: |-
                                objects is a required list of all Kubernetes objects that belong to this phase.

                                All objects in this list are applied to the cluster in no particular order. The maximum number of objects per phase is 50.
                              items:
                                description: |-
                                  ClusterObjectSetObject represents a Kubernetes object to be applied as part
                                  of a phase, along with its collision protection settings.

                                  Exactly one of object or ref must be set.
                                properties:
                                  collisionProtection:
                                    description: |-
                                      collisionProtection controls whether the operator can adopt and modify objects
                                      that already exist on the cluster.

                                      Allowed values are: "Prevent", "IfNoController", and "None".

                                      When set to "Prevent", the operator only manages objects it created itself.
                                      This prevents ownership collisions.

                                      When set to "IfNoController", the operator can adopt and modify pre-existing objects
                                      that are not owned by another controller.
                                      This is useful for taking over management of manually-created resources.

                                      When set to "None", the operator can adopt and modify any pre-existing object, even if
                                      owned by another controller.
                                      Use this setting with extreme caution as it may cause multiple controllers to fight over
                                      the same resource, resulting in increased load on the API server and etcd.

                                      When omitted, the value is inherited from the phase, then spec.
                                    enum:
                                    - Prevent
                                    - IfNoController
                                    - None
                                    type: string
                                  object:
                                    description: |-
                                      object is an optional embedded Kubernetes object to be applied.

                                      Exactly one of object or ref must be set.

                                      This object must be a valid Kubernetes resource with apiVersion, kind, and metadata fields.
                                    type: object
                                    x-kubernetes-embedded-resource: true
                                    x-kubernetes-preserve-unknown-fields: true
                                  ref:
                                    description: |-
                                      ref is an optional reference to a Secret that holds the serialized
                                      object manifest.

                                      Exactly one of object or ref must be set.
                                    properties:
                                      key:
                                        description: |-
                                          key is the data key within the referenced Secret containing the
                                          object manifest content. The value at this key must be a
                                          JSON-serialized Kubernetes object manifest.
                                        maxLength: 253
                                        minLength: 1
                                        type: string
                                      name:
                                        description: name is the name of the referenced
