                    - phases
                    type: object
                required:
                - spec
                type: object
            required:
            - template
            type: object
          status:
            description: status defines the observed state and is written through
              the status subresource.
            properties:
              conditions:
                description: |-
                  conditions describes rollout progress and availability for the observed generation.

                  Progressing is True with reason NewClusterObjectSetProgressing while the desired
                  rollout is incomplete, or False with reason NewClusterObjectSetProgressed after
                  completion. Completion remains recorded even if the completed revision later
                  becomes unhealthy. Progressing is False with reason ProgressDeadlineExceeded when
                  the latest revision does not roll out within spec.template.spec.progressDeadlineMinutes.
                  Progressing is False with reason InvalidSpecification when spec.template.metadata
                  contains labels or annotations that are not valid for the resulting
                  ClusterObjectSet; no new revision is created until the metadata is corrected.

                  Available is True with reason Available when at least one active (non-archived)
                  ClusterObjectSet revision is Ready, so the deployment remains available across
                  rollouts while a previous revision is still Ready. It is False with reason
                  Unavailable when active revisions exist but none are Ready yet, or with reason
                  NoActiveRevision when no active revision exists.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
