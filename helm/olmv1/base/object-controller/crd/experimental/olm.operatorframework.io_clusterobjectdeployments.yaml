metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
    olm.operatorframework.io/generator: experimental
  name: clusterobjectdeployments.olm.operatorframework.io
spec:
  group: olm.operatorframework.io
  names:
    kind: ClusterObjectDeployment
    listKind: ClusterObjectDeploymentList
    plural: clusterobjectdeployments
    shortNames:
    - cod
    singular: clusterobjectdeployment
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Available')].status
      name: Available
      type: string
    - jsonPath: .status.conditions[?(@.type=='Progressing')].status
      name: Progressing
      type: string
    - jsonPath: .metadata.creationTimestamp
