apiVersion: troubleshoot.sh/v1beta2
kind: SupportBundle
metadata:
  name: e2e-tests
spec:
  collectors:
    - clusterResources: {}
    - clusterInfo: {}
    - logs: {}
    - copyFromHost:
        collectorName: "persisted-operator-logs"
        image: "busybox:1.36"
        hostPath: "/var/log/fluentbit/output/"
        name: "operator-logs"
        extractArchive: true
        timeout: "120s"
